# Workspace root for datagenx-mono.
#
# Shared dependency versions and the release profile live here rather than in
# engine/Cargo.toml: Cargo ignores [profile.*] declared in a non-root workspace
# member, so leaving them in the package would silently discard the release
# tuning (lto, codegen-units, panic=abort) that the engine relies on.

[workspace]
members = ["engine"]
resolver = "3"

[workspace.dependencies]
chrono = { version = "0.4.26", default-features = false, features = ["std", "serde", "clock"] }
clap = "4.5"
data-encoding = "2.4"
parse-size = { version = "1.0", features = ["std"] }
rand = { version = "0.8.5", default-features = false, features = ["getrandom"]}
rand_hc = "0.3"
serde = { version = "1.0", features = ["derive"]}
serde_json = "1.0"
thiserror = "1.0"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
debug = 2
split-debuginfo = "packed"
strip = true
